<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 Online Shopping</h1>

    <h2>Available Products</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Price</th>
        </tr>

        {% for product in products %}

        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>₹{{ product.price }}</td>
        </tr>

        {% endfor %}

    </table>

    <div class="footer">
        <p>Data retrieved from MySQL Docker Container</p>
    </div>

</div>

</body>
</html>
